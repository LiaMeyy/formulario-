<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 💗</title>

    <!-- Bootstrap -->
    <link 
      rel="stylesheet" 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #ffeef6;
            font-family: "Poppins", sans-serif;
        }

        .card {
            background-color: #fff5fb;
            border: 2px solid #ffb6d9;
            border-radius: 20px;
        }

        h3, h4 {
            color: #ff6fa8;
            font-weight: 600;
        }

        .btn-primary {
            background-color: #ff8ec7;
            border-color: #ff8ec7;
            border-radius: 30px;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: #ff6fa8;
            border-color: #ff6fa8;
        }

        table {
            border-radius: 15px;
            overflow: hidden;
        }

        thead {
            background-color: #ff9dce !important;
            color: white;
        }

        .btn-warning {
            background-color: #ffd2e9;
            border: none;
            color: #ff4c9c;
            border-radius: 20px;
        }

        .btn-danger {
            background-color: #ffbad1;
            border: none;
            color: #d4005c;
            border-radius: 20px;
        }

        .btn-warning:hover {
            background-color: #ffb0d8;
        }

        .btn-danger:hover {
            background-color: #ff9dbf;
        }

        input.form-control {
            border-radius: 20px;
            border: 1.5px solid #ffb6d9;
        }

        input.form-control:focus {
            border-color: #ff6fa8;
            box-shadow: 0 0 0 .25rem rgba(255, 105, 180, .25);
        }

    </style>
</head>

<body>

    <div class="container mt-5">

        <!-- Formulario -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="text-center mb-4">Registro 💗</h3>

                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" id="nombre" class="form-control" placeholder="Nombre ✨">
                    </div>

                    <div class="col-md-4">
                        <input type="text" id="apellido" class="form-control" placeholder="Apellido 🌸">
                    </div>

                    <div class="col-md-4">
                        <input type="text" id="telefono" class="form-control" placeholder="Teléfono 📱">
                    </div>

                    <div class="col-12 text-center">
                        <button id="btnGuardar" class="btn btn-primary px-5 mt-2">Guardar 💕</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="card shadow-sm mt-4">
            <div class="card-body">
                <h4 class="mb-3">Registros 🌷</h4>

                <table class="table table-bordered text-center">
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Teléfono</th>
                            <th>Opciones</th>
                        </tr>
                    </thead>
                    <tbody id="datos"></tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let inpNombre = document.getElementById("nombre");
        let inpApellido = document.getElementById("apellido");
        let inpTelefono = document.getElementById("telefono");
        let registro = [];
        let editIndex = null;

        document.getElementById("btnGuardar").addEventListener("click", () => {

            if (inpNombre.value == "" || inpApellido.value == "" || inpTelefono.value == "") {
                alert("Todos los campos son obligatorios");
                return;
            }

            if (editIndex === null) {

                let data = {
                    id: Date.now(),
                    nombre: inpNombre.value,
                    apellido: inpApellido.value,
                    telefono: inpTelefono.value
                };
                registro.push(data);

            } else {
                registro[editIndex].nombre = inpNombre.value;
                registro[editIndex].apellido = inpApellido.value;
                registro[editIndex].telefono = inpTelefono.value;

                editIndex = null;
            }

            pintar();
            limpiar();
        });

        function limpiar() {
            inpNombre.value = "";
            inpApellido.value = "";
            inpTelefono.value = "";
        }

        function pintar() {
            document.getElementById("datos").textContent = "";
            registro.forEach((item, indice) => {
                let tr = document.createElement("tr");

                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.nombre}</td>
                    <td>${item.apellido}</td>
                    <td>${item.telefono}</td>
                    <td>
                        <button class="btn btn-warning btn-sm me-2">✏️</button>
                        <button class="btn btn-danger btn-sm">❌</button>
                    </td>
                `;

                let btnEditar = tr.querySelector(".btn-warning");
                let btnEliminar = tr.querySelector(".btn-danger");

                btnEditar.addEventListener("click", () => {
                    inpNombre.value = item.nombre;
                    inpApellido.value = item.apellido;
                    inpTelefono.value = item.telefono;
                    editIndex = indice;
                });

                btnEliminar.addEventListener("click", () => {
                    registro.splice(indice, 1);
                    pintar();
                });

                document.getElementById("datos").appendChild(tr);
            });
        }
    </script>

</body>

</html>
